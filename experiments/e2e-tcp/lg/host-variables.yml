# Loadgen (bulbasaur). setup-host.sh binds these and allow-lists them in dpdk-conf.lua, in this order.
#   port 0 = 0000:05:00.0
#   port 1 = 0000:07:00.0
#   port 2 = 0000:81:00.1   HTTP_OUT
#   port 3 = 0000:85:00.0
#   port 4 = net_tap0       wrkout TAP that wrk2 uses
if-addresses: "0000:05:00.0,0000:07:00.0,0000:81:00.1,0000:85:00.0"
moongen-attack-devs: "0 1 2 3"
moongen-http-out: 2
moongen-http-in: 4
